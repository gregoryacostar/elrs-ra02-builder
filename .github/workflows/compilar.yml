name: Compilar ELRS para RA-02 (433 MHz)

on:
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente con submódulos
      - name: Clonar ExpressLRS
        run: |
          git clone --depth 1 --recurse-submodules --branch 3.4.3 https://github.com/ExpressLRS/ExpressLRS.git elrs

      # 2. Instalar Python y PlatformIO
      - name: Configurar Python y PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar PlatformIO CLI
        run: pip install platformio

      # 3. Forzar el dominio a 433 MHz
      - name: Configurar dominio regulatorio 433 MHz
        run: |
          cd elrs/src
          # Reemplaza el dominio por defecto al dominio AU_433 (Banda de 433 MHz)
          find . -name "*.ini" -exec sed -i 's/-D Regulatory_Domain_ISM_2400/-D Regulatory_Domain_AU_433/g' {} +
          find . -name "*.ini" -exec sed -i 's/-D Regulatory_Domain_FCC_915/-D Regulatory_Domain_AU_433/g' {} +

      # 4. Compilar en la subcarpeta src/
      - name: Compilar con PlatformIO
        run: |
          cd elrs/src
          # Si compilas para ESP32-C3 TX usa: Unified_ESP32C3_900_TX_via_UART
          # Si compilas para ESP32 Clásico TX usa: Unified_ESP32_900_TX_via_UART
          pio run -e Unified_ESP32_900_TX_via_UART

      # 5. Guardar el archivo .bin generado
      - name: Subir Binario Compilado (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: firmware_elrs_ra02_tx
          path: elrs/src/.pio/build/**/firmware.bin
