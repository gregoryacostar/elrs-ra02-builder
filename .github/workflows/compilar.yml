name: Compilar ELRS para ESP32-C3 SuperMini (433 MHz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar ExpressLRS con submódulos
      - name: Clonar ExpressLRS
        run: |
          git clone --depth 1 --recurse-submodules --branch 3.4.3 https://github.com/ExpressLRS/ExpressLRS.git elrs

      # 2. Instalar PlatformIO
      - name: Configurar Python y PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar PlatformIO CLI
        run: pip install platformio

      # 3. Configurar user_defines.txt (433 MHz + Clave de Enlace)
      - name: Configurar user_defines.txt
        run: |
          cd elrs/src
          cat << 'EOF' > user_defines.txt
          -DRegulatory_Domain_AU_433
          -DMY_BINDING_PHRASE="vtol_expresslrs"
          EOF

      # 4. Compilar Transmisor (TX) y Receptor (RX) para ESP32-C3
      - name: Compilar Firmware TX y RX
        run: |
          cd elrs/src
          echo "Compilando Transmisor (TX)..."
          pio run -e Unified_ESP32C3_900_TX_via_UART
          
          echo "Compilando Receptor (RX)..."
          pio run -e Unified_ESP32C3_900_RX_via_UART

      # 5. Guardar ambos binarios en un solo paquete descargable
      - name: Subir Binarios (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: elrs_c3_supermini_433mhz
          path: |
            elrs/src/.pio/build/Unified_ESP32C3_900_TX_via_UART/firmware.bin
            elrs/src/.pio/build/Unified_ESP32C3_900_RX_via_UART/firmware.bin
