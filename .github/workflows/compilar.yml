name: Compilar ELRS para ESP32-C3 SuperMini (433 MHz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar ExpressLRS (master)
      - name: Clonar ExpressLRS (master)
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ExpressLRS/ExpressLRS.git elrs

      # 2. Instalar PlatformIO
      - name: Configurar Python y PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar PlatformIO CLI
        run: pip install platformio

      # 3. Configurar user_defines.txt (433 MHz + Binding Phrase)
      - name: Configurar user_defines.txt
        run: |
          cd elrs/src
          cat << 'EOF' > user_defines.txt
          -DRegulatory_Domain_AU_433
          -DMY_BINDING_PHRASE="vtol_expresslrs"
          EOF

      # 4. Compilar Receptor (RX) por separado
      - name: Compilar Receptor RX C3 (433MHz)
        run: |
          cd elrs/src
          pio run -e Unified_ESP32C3_900_RX_via_UART

      # 5. Compilar Transmisor (TX) por separado
      - name: Compilar Transmisor TX C3 (433MHz)
        run: |
          cd elrs/src
          pio run -e Unified_ESP32C3_900_TX_via_UART

      # 6. Organizar y renombrar los archivos encontrados
      - name: Preparar archivos para descarga
        run: |
          mkdir -p binarios_listos
          
          # Copia segura del RX si existe
          if [ -f elrs/src/.pio/build/Unified_ESP32C3_900_RX_via_UART/firmware.bin ]; then
            cp elrs/src/.pio/build/Unified_ESP32C3_900_RX_via_UART/firmware.bin binarios_listos/firmware_RX_avion.bin
            echo "-> Firmware RX copiado con exito."
          else
            echo "-> Buscando binario RX..."
            find elrs/src/.pio/build/Unified_ESP32C3_900_RX_via_UART/ -name "*.bin" -exec cp {} binarios_listos/firmware_RX_avion.bin \;
          fi

          # Copia segura del TX si existe
          if [ -f elrs/src/.pio/build/Unified_ESP32C3_900_TX_via_UART/firmware.bin ]; then
            cp elrs/src/.pio/build/Unified_ESP32C3_900_TX_via_UART/firmware.bin binarios_listos/firmware_TX_emisora.bin
            echo "-> Firmware TX copiado con exito."
          fi

      # 7. Subir los binarios resultantes
      - name: Subir Binarios Compilados (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: elrs_c3_supermini_433mhz
          path: binarios_listos/
