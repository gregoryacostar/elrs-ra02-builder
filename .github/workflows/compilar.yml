name: Compilar ELRS TX (ESP32-C3 433MHz)

on:
  workflow_dispatch:
    inputs:
      binding_phrase:
        description: 'Binding Phrase (Clave de enlace)'
        required: true
        default: 'vtol_expresslrs'

jobs:
  build-tx:
    name: Build TX Firmware
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar ExpressLRS (rama master con submódulos)
      - name: Clonar ExpressLRS (master)
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ExpressLRS/ExpressLRS.git elrs

      # 2. Configurar entorno Python y PlatformIO
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      # 3. Inyectar configuración: 433 MHz + Clave + Temporizador Auto-WiFi
      - name: Inyectar user_defines.txt
        working-directory: elrs/src
        env:
          PHRASE: ${{ github.event.inputs.binding_phrase || 'vtol_expresslrs' }}
        run: |
          echo "-DRegulatory_Domain_AU_433" > user_defines.txt
          echo "-DMY_BINDING_PHRASE=\"$PHRASE\"" >> user_defines.txt
          echo "-DAUTO_WIFI_ON_INTERVAL=30" >> user_defines.txt
          echo "=== user_defines.txt generado ==="
          cat user_defines.txt

      # 4. Compilar target TX unificado para ESP32-C3
      - name: Compilar Target TX
        working-directory: elrs/src
        run: |
          pio run -e Unified_ESP32C3_900_TX_via_UART

      # 5. Guardar el archivo .bin del Transmisor
      - name: Subir Binario como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: firmware_TX_emisora
          path: elrs/src/.pio/build/Unified_ESP32C3_900_TX_via_UART/firmware.bin
          if-no-files-found: error
