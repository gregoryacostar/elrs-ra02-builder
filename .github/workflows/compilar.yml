name: Compilar ELRS TX para ESP32-C3 SuperMini (433 MHz)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar ExpressLRS (master)
      - name: Clonar ExpressLRS (master)
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ExpressLRS/ExpressLRS.git elrs

      # 2. Instalar PlatformIO
      - name: Configurar Python y PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar PlatformIO CLI
        run: pip install platformio

      # 3. Configurar user_defines.txt (433 MHz + Binding Phrase idéntica a la del RX)
      - name: Configurar user_defines.txt
        run: |
          cd elrs/src
          cat << 'EOF' > user_defines.txt
          -DRegulatory_Domain_AU_433
          -DMY_BINDING_PHRASE="vtol_expresslrs"
          EOF

      # 4. Compilar ÚNICAMENTE el Transmisor (TX)
      - name: Compilar Transmisor TX C3
        run: |
          cd elrs/src
          pio run -e Unified_ESP32C3_900_TX_via_UART

      # 5. Guardar el archivo .bin del Transmisor
      - name: Subir Binario del Transmisor (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: firmware_TX_emisora
          path: elrs/src/.pio/build/Unified_ESP32C3_900_TX_via_UART/firmware.bin
